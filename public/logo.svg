<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:1" /> <!-- Purple-500 -->
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" /> <!-- Indigo-600 -->
    </linearGradient>
    <linearGradient id="secondary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14B8A6;stop-opacity:1" /> <!-- Teal-500 -->
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" /> <!-- Blue-600 -->
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" ry="100" fill="#0B0F1A"/>
  
  <!-- Outer subtle ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1C243B" stroke-width="12"/>

  <!-- S-Curve Abstract Shape (Wallet/Wave) -->
  <path d="M 170 340 
           C 170 200, 340 320, 340 180" 
        fill="none" 
        stroke="url(#primary)" 
        stroke-width="48" 
        stroke-linecap="round" 
        filter="url(#glow)"/>

  <!-- Accent Ascending Line (Growth) -->
  <path d="M 180 240 
           L 300 120 
           L 380 180" 
        fill="none" 
        stroke="url(#secondary)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Coin Indicator (Value) -->
  <circle cx="300" cy="120" r="24" fill="#FDE047" filter="url(#glow)"/>

  <!-- Base platform -->
  <line x1="140" y1="380" x2="370" y2="380" stroke="#1C243B" stroke-width="16" stroke-linecap="round"/>
  
</svg>
